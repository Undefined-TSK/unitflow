[pytest]
testpaths = tests
python_files = test_*.py
# CI 里裸 `pytest` 命令不会把 CWD 放进 sys.path（本地 `python -m pytest` 会，
# 所以本地绿而 CI 红）。显式声明 rootdir 入 path，保证两种入口行为一致。
pythonpath = .
addopts = -q --tb=short -m "not network"
markers =
    network: 真实调用外部 API（百炼/HF）的测试，默认不跑，需显式 -m network
filterwarnings =
    ignore::DeprecationWarning
